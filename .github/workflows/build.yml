name: build

on:
  push:
    branches: [main, lean, test, test2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-33" > /dev/null
      - name: Third-party sources
        run: bash tools/setup.sh
      - name: Runtime compute shaders
        run: bash tools/shaders.sh
      - name: Mod archive library cache
        uses: actions/cache@v4
        with:
          path: build/mod-dependencies
          key: mod-dependencies-${{ hashFiles('tools/mod_archive_dependency.py') }}
      - name: FFmpeg cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-android
          key: ffmpeg-android-${{ hashFiles('tools/build_ffmpeg.sh') }}
      - name: FFmpeg (video fallback)
        run: bash tools/build_ffmpeg.sh
      - name: Build APK
        env:
          LUA_LAB: '1'
          # The test branches (test, test2) build the optimized (release) APK; main and lean stay the testing build.
          RELEASE: ${{ startsWith(github.ref_name, 'test') && '1' || '0' }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KS_PASS }}
        run: |
          # Sign with the project's release key when the secrets exist (it installs over a release APK), else debug key.
          if [ "$RELEASE" = 1 ] && [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE="$RUNNER_TEMP/release.jks" KEY_ALIAS=recomp
          fi
          bash tools/build_apk.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: mhriseport
          path: build/mhriseport.apk
          if-no-files-found: error
